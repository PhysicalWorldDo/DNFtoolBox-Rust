[package]
name = "physical-world-toolbox"
version = "0.4.5"
edition = "2021"
rust-version = "1.89"
description = "物理世界的工具箱桌面宿主"
default-run = "PhysicalWorldToolbox"

[[bin]]
name = "PhysicalWorldToolbox"
path = "src/main.rs"

[lib]
name = "toolbox_host"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
toolbox-core = { path = "../crates/toolbox-core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
default = ["core"]
core = ["dep:toolbox-core"]
custom-protocol = ["tauri/custom-protocol"]
